name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cylinder_gallery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Type check client
        run: npm run typecheck --prefix client

      - name: Type check server
        run: npm run typecheck --prefix server

      - name: Build client
        run: npm run build --prefix client

      - name: Build server
        run: npm run build --prefix server

      - name: Run migrations
        run: npm run db:migrate --prefix server
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cylinder_gallery

      - name: Seed database
        run: npm run seed --prefix server
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cylinder_gallery
